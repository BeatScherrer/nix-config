# mangowm configuration — mimics the niri config in ../niri/config.kdl
# https://github.com/DreamMaoMao/mango/wiki/
#
# Niri uses scrollable tiling with workspaces; mango (dwl-based) uses tags
# with dynamic layouts. We pick the `scroller` layout to get the same
# left/right scrolling feel niri provides. The 9 workspaces in niri map to
# the 9 tags in mango.

# --- Window appearance (mirrors niri focus-ring) ---
borderpx=2
focuscolor=0xde935fff
bordercolor=0x323232ff
urgentcolor=0xad401fff
maximizescreencolor=0x89aa61ff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff
rootcolor=0x201b14ff

border_radius=12
no_radius_when_single=0
no_border_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# --- Gaps (mirrors niri `gaps 10`) ---
gappih=5
gappiv=5
gappoh=10
gappov=10
smartgaps=0

# --- Scroller layout (closest analogue to niri columns) ---
scroller_structs=20
scroller_default_proportion=0.5
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.33333,0.5,0.66667

# Initial layout per tag; SUPER+t (switch_layout) cycles through circle_layout
circle_layout=scroller,tile,grid,monocle,dwindle
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:scroller
tagrule=id:4,layout_name:scroller
tagrule=id:5,layout_name:scroller
tagrule=id:6,layout_name:scroller
tagrule=id:7,layout_name:scroller
tagrule=id:8,layout_name:scroller
tagrule=id:9,layout_name:scroller

# --- Animations (mirrors niri animations block) ---
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=1.0
animation_duration_open=150
animation_duration_close=150
animation_duration_move=300
animation_duration_tag=300
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_focus=0.46,1.0,0.29,1

# --- Input (mirrors niri input block) ---
repeat_rate=25
repeat_delay=600
xkb_rules_layout=us,ch
xkb_rules_options=grp:alt_shift_toggle,compose:ralt

tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
disable_while_typing=1

mouse_natural_scrolling=0
sloppyfocus=0
warpcursor=1
cursor_size=24

# --- Misc ---
focus_cross_monitor=0
focus_cross_tag=0
hotarea_size=10
enable_hotarea=1

# --- Environment ---
env=DISPLAY,:0
env=NIXOS_OZONE_WL,1

# --- Autostart (mirrors niri spawn-at-startup) ---
exec-once=xwayland-satellite
exec-once=noctalia-shell
exec-once=swaync
exec-once=/usr/libexec/polkit-gnome-authentication-agent-1
exec-once=gnome-keyring-daemon --start --components=secrets

# --- Window rules (mirrors niri window-rule blocks) ---
windowrule=isfloating:1,appid:pavucontrol
windowrule=isfloating:1,appid:blueman-manager
windowrule=isfloating:1,title:Picture.in.[Pp]icture
windowrule=isfloating:1,appid:gnuplot_qt

# ============================================================================
# Key Bindings
# ============================================================================

# --- Window management ---
bind=SUPER,w,killclient
bind=SUPER,m,togglemaximizescreen
bind=SUPER+SHIFT,m,togglefullscreen
bind=SUPER+SHIFT,f,togglefloating
bind=SUPER,c,centerwin

# --- Focus navigation (vim-style) ---
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right

# --- Focus navigation (arrow keys) ---
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right

# --- Move windows (vim-style) ---
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,l,exchange_client,right

# --- Move windows (arrow keys) ---
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Right,exchange_client,right

# --- Workspace navigation (tags) ---
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

# --- Move window to tag ---
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

# --- Workspace cycling (niri Mod+. / Mod+,) ---
bind=SUPER,period,viewtoright
bind=SUPER,comma,viewtoleft

# --- Monitor navigation ---
bind=SUPER,BackSpace,focusmon,right
bind=SUPER+SHIFT,BackSpace,tagmon,right

# --- Column width / window height adjustment ---
# Mango's scroller layout uses proportion presets rather than incremental
# percent steps; map niri's incremental Mod+-/Mod+= to fixed proportions.
bind=SUPER,minus,set_proportion,0.33333
bind=SUPER,equal,set_proportion,0.66667
# No direct window-height analogue in scroller; reuse for incnmaster.
bind=SUPER+SHIFT,minus,incnmaster,-1
bind=SUPER+SHIFT,equal,incnmaster,+1

# --- Layout presets ---
bind=SUPER,r,switch_proportion_preset
bind=SUPER,t,switch_layout

# --- Direct layout selection (switch_layout has no reverse direction) ---
bind=SUPER+ALT,1,setlayout,scroller
bind=SUPER+ALT,2,setlayout,tile
bind=SUPER+ALT,3,setlayout,grid
bind=SUPER+ALT,4,setlayout,monocle
bind=SUPER+ALT,5,setlayout,dwindle

# --- Consume / expel (closest scroller analogue) ---
bind=SUPER,bracketleft,scroller_stack,left
bind=SUPER,bracketright,scroller_stack,right

# --- Application launchers ---
bind=SUPER,Return,spawn,ghostty
bind=SUPER,space,spawn,noctalia-shell ipc call launcher toggle
bind=SUPER,b,spawn,librewolf
bind=SUPER,f,spawn,nautilus
bind=SUPER,e,spawn,evolution

# --- Screenshot ---
bind=NONE,Print,spawn,grimblast copy area
bind=SUPER,Print,spawn,grimblast copy screen

# --- Media keys ---
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioPause,spawn,playerctl play-pause
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# --- Brightness ---
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set +5%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-

# --- Session ---
bind=SUPER+SHIFT,q,quit
bind=SUPER+CTRL,r,reload_config

# --- Mouse bindings ---
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# --- Touchpad gestures ---
# 3-finger: focus direction
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down

# 4-finger: workspace navigation + overview
gesturebind=none,left,4,viewtoleft_have_client
gesturebind=none,right,4,viewtoright_have_client
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview
